name: Stale Issue & PR Management

on:
  schedule:
    - cron: '30 1 * * *'  # Daily at 01:30 UTC
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/stale@v11
        with:
          # Issue settings
          stale-issue-message: >
            This issue has been inactive for 60 days. It will be closed in 14 days
            unless there is new activity. If this is still relevant, please comment
            to keep it open.
          close-issue-message: >
            This issue has been closed due to 74 days of inactivity. Feel free to
            reopen if it remains relevant.
          stale-issue-label: 'stale'
          exempt-issue-labels: 'pinned,security,enhancement,question'
          days-before-issue-stale: 60
          days-before-issue-close: 14

          # PR settings
          stale-pr-message: >
            This pull request has been inactive for 30 days. It will be closed in
            7 days unless there is new activity. If you're still working on this,
            please push new changes or leave a comment.
          close-pr-message: >
            This pull request has been closed due to 37 days of inactivity. Feel
            free to reopen or create a new PR with your changes.
          stale-pr-label: 'stale'
          exempt-pr-labels: 'pinned,security,dependencies'
          days-before-pr-stale: 30
          days-before-pr-close: 7

          # General settings
          operations-per-run: 100
          remove-stale-when-updated: true
          delete-branch: true
          debug-only: false
