name: Check Content Freshness

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find stale "Last updated" dates
        id: freshness
        run: |
          echo "### 📅 Content Freshness Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Last Updated | Days Since | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY

          now=$(date +%s)
          warning_count=0
          error_count=0
          report=""

          # Find all markdown files under docs/ and data/
          while IFS= read -r file; do
            # Extract "Last updated: YYYY-MM-DD" from file
            last_updated=$(grep -i "last updated.*[12][0-9][0-9][0-9]-[0-1][0-9]-[0-3][0-9]" "$file" | head -1 | grep -oP '[12][0-9][0-9][0-9]-[0-1][0-9]-[0-3][0-9]')
            if [ -z "$last_updated" ]; then
              # Skip files without "Last updated" header
              continue
            fi

            file_epoch=$(date -d "$last_updated" +%s 2>/dev/null || echo 0)
            if [ "$file_epoch" -eq 0 ]; then
              continue
            fi

            days=$(( (now - file_epoch) / 86400 ))

            if [ "$days" -gt 90 ]; then
              echo "| \`$file\` | $last_updated | $days | ❌ STALE (>90d) |" >> $GITHUB_STEP_SUMMARY
              report="$report\n❌ $file (last updated: $last_updated, $days days ago)"
              error_count=$((error_count + 1))
            elif [ "$days" -gt 60 ]; then
              echo "| \`$file\` | $last_updated | $days | ⚠️ Aging (>60d) |" >> $GITHUB_STEP_SUMMARY
              report="$report\n⚠️ $file (last updated: $last_updated, $days days ago)"
              warning_count=$((warning_count + 1))
            fi
          done < <(find docs/ data/ -name "*.md")

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary: $warning_count warnings (>60d), $error_count errors (>90d)**" >> $GITHUB_STEP_SUMMARY

          echo "warning_count=$warning_count" >> $GITHUB_OUTPUT
          echo "error_count=$error_count" >> $GITHUB_OUTPUT
          if [ -n "$report" ]; then
            echo "report<<EOF" >> $GITHUB_OUTPUT
            echo -e "$report" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Create issue if stale content found
        if: steps.freshness.outputs.error_count > 0 || steps.freshness.outputs.warning_count > 0
        uses: actions/github-script@v7
        with:
          script: |
            const errorCount = parseInt('${{ steps.freshness.outputs.error_count }}');
            const warningCount = parseInt('${{ steps.freshness.outputs.warning_count }}');
            const report = process.env.STALE_REPORT;

            // Close existing stale content issues (keep only the latest)
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'maintenance'
            });

            const staleIssues = issues.data.filter(i =>
              i.title.includes('Content Freshness') || i.title.includes('Stale Content')
            );

            for (const old of staleIssues.slice(1)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: old.number,
                state: 'closed'
              });
            }

            const severity = errorCount > 0 ? '❗' : '⚠️';
            const title = `${severity} Content Freshness Report — ${new Date().toISOString().slice(0, 10)}`;

            const body = [
              `**${errorCount} files >90 days stale, ${warningCount} files >60 days aging**`,
              '',
              '### Stale Files',
              report,
              '',
              '---',
              '_Generated by [check-freshness.yml](https://github.com/${{ github.repository }}/actions/workflows/check-freshness.yml)_'
            ].join('\n');

            if (staleIssues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: staleIssues[0].number,
                title: title,
                body: body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['maintenance']
              });
            }
        env:
          STALE_REPORT: ${{ steps.freshness.outputs.report }}
