name: Validate Links

on:
  schedule:
    - cron: '0 0 1 * *'  # Monthly on 1st
  workflow_dispatch:
  pull_request:
    paths:
      - '**.md'
      - '**.yaml'
      - '**.yml'
      - '**.toml'

jobs:
  validate-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check external links
        uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: >-
            --config .lychee.toml
            --no-progress
            .
          output: lychee/out.md
          fail: false
          jobSummary: true

      - name: Upload lychee report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lychee-report
          path: lychee/out.md

      - name: Summarize broken links
        if: steps.lychee.outputs.exit_code != 0
        run: |
          echo "## 🔗 Link Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lychee/out.md ]; then
            cat lychee/out.md >> $GITHUB_STEP_SUMMARY
          fi
          echo "Found broken links. See artifact for full report." >> $GITHUB_STEP_SUMMARY

      - name: Create Issue on Failure (scheduled only)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('lychee/out.md', 'utf8');
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔗 Link Validation Report — ' + new Date().toISOString().slice(0, 10),
              body: `Broken links found during monthly scan:\n\n${report}\n\n---\n_Generated by [Validate Links workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/validate-links.yml)_`,
              labels: ['maintenance']
            });
